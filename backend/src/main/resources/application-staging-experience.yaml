server:
  error:
    include-message: never
    include-stacktrace: never

spring:
  datasource:
    url: ${FITNESS_DB_URL}
    username: ${FITNESS_DB_USERNAME}
    password: ${FITNESS_DB_PASSWORD}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

fitness:
  auth:
    wechat:
      app-id: ${WECHAT_APP_ID}
      app-secret: ${WECHAT_APP_SECRET}
      trust-cloudbase-identity-headers: ${FITNESS_TRUST_CLOUDBASE_IDENTITY_HEADERS:false}
  content:
    environment: staging-experience
  plan:
    repository: mysql
    candidate-cache-capacity: ${FITNESS_PLAN_CANDIDATE_CACHE_CAPACITY:512}
  workout:
    repository: mysql
  progression:
    repository: mysql
  ai:
    enabled: false
