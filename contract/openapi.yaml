openapi: 3.1.0
info:
  title: AI 健身助手 P0 API
  version: 1.0.0
  description: >-
    微信首发但渠道无关的业务契约。关键训练数字由版本化确定性规则产生，
    AI 仅提供候选、排序和解释；用户归属始终由认证主体确定。
servers:
  - url: /
    description: local/test relative base
security:
  - bearerAuth: []
tags:
  - {name: Auth}
  - {name: Profile}
  - {name: Content}
  - {name: Plans}
  - {name: Workouts}
  - {name: Sync}
  - {name: Progression}
  - {name: AI}
  - {name: Privacy}
paths:
  /api/v1/auth/wechat/login:
    post:
      tags: [Auth]
      operationId: loginWithWechatCode
      security: []
      requestBody: {$ref: '#/components/requestBodies/WechatLogin'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DefaultError'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      requestBody: {$ref: '#/components/requestBodies/RefreshSession'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      responses:
        '200':
          description: 当前用户档案
          content:
            application/json:
              schema: {$ref: './schemas/profile.yaml#/components/schemas/UserProfileResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/DefaultError'}
    put:
      tags: [Profile]
      operationId: updateProfile
      requestBody: {$ref: '#/components/requestBodies/ProfileUpdate'}
      responses:
        '200':
          description: 更新后的当前用户档案
          content:
            application/json:
              schema: {$ref: './schemas/profile.yaml#/components/schemas/UserProfileResponse'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/profile/equipment:
    get:
      tags: [Profile]
      operationId: getEquipmentProfile
      responses:
        '200':
          description: 当前用户器械档案
          content:
            application/json:
              schema: {$ref: './schemas/profile.yaml#/components/schemas/EquipmentProfileResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
    put:
      tags: [Profile]
      operationId: updateEquipmentProfile
      requestBody: {$ref: '#/components/requestBodies/EquipmentUpdate'}
      responses:
        '200':
          description: 更新后的当前用户器械档案
          content:
            application/json:
              schema: {$ref: './schemas/profile.yaml#/components/schemas/EquipmentProfileResponse'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/profile/preferences:
    get:
      tags: [Profile]
      operationId: getExercisePreferences
      responses:
        '200':
          description: 当前用户动作偏好
          content:
            application/json:
              schema: {$ref: './schemas/profile.yaml#/components/schemas/PreferenceProfileResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
    put:
      tags: [Profile]
      operationId: updateExercisePreferences
      requestBody: {$ref: '#/components/requestBodies/PreferencesUpdate'}
      responses:
        '200':
          description: 更新后的当前用户动作偏好
          content:
            application/json:
              schema: {$ref: './schemas/profile.yaml#/components/schemas/PreferenceProfileResponse'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/exercises:
    get:
      tags: [Content]
      operationId: listExercises
      parameters:
        - {name: equipmentType, in: query, required: false, schema: {type: string}}
        - {name: movementPattern, in: query, required: false, schema: {type: string}}
        - {name: muscleGroup, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: 当前用户器械可支持且符合当前环境发布级别的动作
          content:
            application/json:
              schema: {$ref: './schemas/content.yaml#/components/schemas/ExerciseListResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/exercises/{id}:
    get:
      tags: [Content]
      operationId: getExercise
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: 动作详情、通俗解释、图片回退引用与合法替代动作
          content:
            application/json:
              schema: {$ref: './schemas/content.yaml#/components/schemas/ExerciseDetailResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/exercises/{sourceCode}/replacements:
    get:
      tags: [Content, Workouts]
      operationId: listExerciseReplacements
      description: 仅返回当前用户器械可用、未排除且审核状态合格，并且动作模式、难度、主要肌群、负重模式与处方转换兼容的替代动作；不修改计划或训练快照。
      parameters:
        - {name: sourceCode, in: path, required: true, schema: {type: string, pattern: '^[A-Z0-9_]+$'}}
      responses:
        '200':
          description: 1 至 4 个通用安全替代候选；无合法候选时宁缺毋滥
          content:
            application/json:
              schema: {$ref: './schemas/content.yaml#/components/schemas/ExerciseReplacementResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DefaultError'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/workout-sessions/{sessionId}/exercises/{snapshotId}/replacements:
    get:
      tags: [Workouts]
      operationId: listWorkoutExerciseReplacements
      description: 绑定当前用户的训练会话和快照，排除本次训练已有动作后返回安全替代候选。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: snapshotId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 1 至 4 个不与本次训练其他动作重复的安全候选
          content:
            application/json:
              schema: {$ref: './schemas/content.yaml#/components/schemas/ExerciseReplacementResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DefaultError'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plan-templates:
    get:
      tags: [Content]
      operationId: listPlanTemplates
      parameters:
        - {name: weeklyFrequency, in: query, required: false, schema: {type: integer, minimum: 2, maximum: 6}}
      responses:
        '200':
          description: 当前用户器械可完整执行的版本化模板摘要
          content:
            application/json:
              schema: {$ref: './schemas/content.yaml#/components/schemas/PlanTemplateListResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/candidates:
    post:
      tags: [Plans]
      operationId: generatePlanCandidates
      description: 接收小程序 AI 生成的结构化计划并由服务端规则校验；AI 不可用或一次修复仍失败时，可显式请求规则保底计划。
      requestBody: {$ref: '#/components/requestBodies/PlanCandidates'}
      responses:
        '200':
          description: 已校验的 AI 个性化候选、明确标记的规则保底候选，或可操作失败原因
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanCandidateGenerationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/presets:
    get:
      tags: [Plans]
      operationId: listSystemPlanPresets
      description: 返回当前环境可选择的版本化系统计划预设摘要；选择预设仍需生成候选并显式激活。
      responses:
        '200':
          description: 系统计划预设摘要
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanPresetListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/generation-context:
    get:
      tags: [Plans]
      operationId: getPlanGenerationContext
      description: 返回服务端规范化用户资料、当前可用动作白名单及规则硬约束，供小程序 AI 生成候选；不包含凭据或服务端内部提示。
      parameters:
        - name: profileVersion
          in: query
          required: true
          schema: {$ref: './schemas/common.yaml#/components/schemas/ExpectedVersion'}
      responses:
        '200':
          description: 当前用户的计划生成事实与约束
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanGenerationContextResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/{planId}/exercise-options:
    get:
      tags: [Plans]
      operationId: listPlanExerciseOptions
      description: 返回当前活动计划模板中可添加到指定训练日的规则处方；关键数字来自已验证模板，不由客户端或 AI 生成。
      parameters:
        - {name: planId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: dayCode, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Z0-9_]+$'}}
      responses:
        '200':
          description: 当前用户、器械、排除偏好和模板共同允许的动作处方
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanExerciseOptionListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/{planId}/exercise-replacements:
    get:
      tags: [Plans]
      operationId: listPlanExerciseReplacements
      description: 返回指定计划日内原动作的已审核严格等价替换；候选保持原组数、次数和休息，仅在负重模式变化时要求重新校准。
      parameters:
        - {name: planId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: dayCode, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Z0-9_]+$'}}
        - {name: sourceExerciseCode, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Z0-9_]+$'}}
      responses:
        '200':
          description: 同动作模式、主要肌群和难度且符合当前器械与排除偏好的替换候选；无合格项时 items 为空。
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanExerciseReplacementOptionListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/{planId}/day-options:
    get:
      tags: [Plans]
      operationId: listPlanDayOptions
      description: 返回当前活动计划所属模板的完整训练日处方；客户端按当前工作副本过滤已使用项，关键数字来自已验证模板。
      parameters:
        - {name: planId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 可用于恢复或添加到当前自定义计划中的模板训练日
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanDayOptionListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/validate:
    post:
      tags: [Plans]
      operationId: validatePlanDraft
      requestBody: {$ref: '#/components/requestBodies/PlanValidation'}
      responses:
        '200':
          description: 按指定规则版本校验计划草稿
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanValidationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans:
    post:
      tags: [Plans]
      operationId: createInitialPlan
      requestBody: {$ref: '#/components/requestBodies/PlanCreation'}
      responses:
        '201':
          description: 已激活候选计划；首次创建计划，已有计划时追加不可变的新版本
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/ActivePlanResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/active:
    get:
      tags: [Plans]
      operationId: getActivePlan
      responses:
        '200':
          description: 当前活动计划及其不可变版本
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/ActivePlanResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/{planId}/versions/{versionNo}:
    get:
      tags: [Plans]
      operationId: getPlanVersion
      parameters:
        - {$ref: '#/components/parameters/PlanIdPath'}
        - {$ref: '#/components/parameters/VersionNoPath'}
      responses:
        '200':
          description: 指定的历史计划版本
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanVersionResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/{planId}/versions:
    post:
      tags: [Plans]
      operationId: createPlanVersion
      parameters:
        - {$ref: '#/components/parameters/PlanIdPath'}
      requestBody: {$ref: '#/components/requestBodies/PlanVersionCreation'}
      responses:
        '200':
          description: 存在警告，必须携带 warningConfirmationToken 再次确认
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanVersionResultResponse'}
        '201':
          description: 新不可变版本已创建并切换为活动版本
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanVersionResultResponse'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/plans/{planId}/rebalance:
    post:
      tags: [Plans]
      operationId: previewPlanRebalance
      description: 只返回预览；USER_LOCKED 字段不得被静默覆盖。
      parameters:
        - {$ref: '#/components/parameters/PlanIdPath'}
      requestBody: {$ref: '#/components/requestBodies/PlanRebalance'}
      responses:
        '200':
          description: 重平衡预览，不创建版本
          content:
            application/json:
              schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanVersionResultResponse'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/workout-recovery-checks:
    get:
      tags: [Workouts]
      operationId: checkWorkoutRecovery
      description: >-
        在创建新训练会话前，用当前用户最近已完成且未作废的实际训练事实检查主要肌群恢复窗口；
        该接口只读，不自动重排训练日、不自动减量，也不提供医疗判断。
      parameters:
        - {name: planId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: planVersionNo, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: trainingDayCode, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200':
          description: 版本化恢复窗口检查结果；CONFIRMATION_REQUIRED 需要用户明确决定后客户端才可启动
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutRecoveryCheckResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DefaultError'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/workout-sessions:
    post:
      tags: [Workouts]
      operationId: startWorkoutSession
      parameters:
        - {$ref: './schemas/common.yaml#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/WorkoutSessionStart'}
      responses:
        '201':
          description: 会话已创建；同一用户和 clientSessionKey 仅在原会话仍为 CREATED 时返回首次创建结果
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutSessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: 服务端原子重算后需要恢复确认、幂等键冲突、已有未结束训练，或该启动键对应会话已经结束；均不会创建第二个会话。
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutSessionStartConflictResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
    get:
      tags: [Workouts]
      operationId: listWorkoutSessions
      parameters:
        - {$ref: './schemas/common.yaml#/components/parameters/Cursor'}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: 当前用户的终态训练历史，使用稳定不透明游标分页
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutHistoryResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/workout-sessions/{id}:
    get:
      tags: [Workouts]
      operationId: getWorkoutSession
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: 用户归属的不可变训练快照
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutSessionResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/workout-sessions/{id}/status:
    put:
      tags: [Workouts]
      operationId: updateWorkoutSessionStatus
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody: {$ref: '#/components/requestBodies/WorkoutStatusUpdate'}
      responses:
        '200':
          description: 状态转换后的会话
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutSessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/workout-sessions/{id}/exercises/{exerciseId}:
    put:
      tags: [Workouts]
      operationId: updateWorkoutSessionExercise
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {$ref: '#/components/parameters/ExerciseIdPath'}
      requestBody: {$ref: '#/components/requestBodies/WorkoutExerciseUpdate'}
      responses:
        '200':
          description: 仅当前训练生效的替换覆盖层；原计划版本和原始训练快照保持不变
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutSessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: 版本冲突，或当前训练已无不重复且安全的替代动作
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutExerciseUpdateConflictResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/workout-sessions/{sessionId}/sets/{setId}:
    put:
      tags: [Workouts]
      operationId: upsertWorkoutSet
      parameters:
        - {$ref: '#/components/parameters/SessionIdPath'}
        - {$ref: '#/components/parameters/ClientSetKeyAsSetIdPath'}
        - {$ref: './schemas/common.yaml#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/SetUpsert'}
      responses:
        '200':
          description: 幂等保存后的规范化组记录；重试返回首次保存结果
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutSetResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
    delete:
      tags: [Workouts]
      operationId: voidWorkoutSet
      description: 追加不可变作废审计事实；原训练组事实保留，但汇总、历史和进阶读取不再计入该组。
      parameters:
        - {$ref: '#/components/parameters/SessionIdPath'}
        - {$ref: '#/components/parameters/SetIdPath'}
        - {$ref: './schemas/common.yaml#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/SetDeletion'}
      responses:
        '200':
          description: 首次追加或幂等重放的作废审计事实
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutSetVoidResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/workout-sessions/{id}/complete:
    post:
      tags: [Workouts]
      operationId: completeWorkoutSession
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {$ref: './schemas/common.yaml#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/WorkoutCompletion'}
      responses:
        '200':
          description: 幂等训练结算；提前结束保留已完成组且不自动进入加重
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutCompletionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/sync/workout-operations:
    post:
      tags: [Sync]
      operationId: syncWorkoutOperations
      description: 每项独立返回 APPLIED、DUPLICATE、CONFLICT 或 REJECTED。
      requestBody: {$ref: '#/components/requestBodies/WorkoutOperationSync'}
      responses:
        '200':
          description: 每项独立处理后的结果
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/SyncWorkoutOperationsResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/sync/conflicts:
    get:
      tags: [Sync]
      operationId: listSyncConflicts
      responses:
        '200':
          description: 当前用户待处理的同步冲突
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/SyncConflictListResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/sync/conflicts/{id}/resolve:
    post:
      tags: [Sync]
      operationId: resolveSyncConflict
      description: |
        KEEP_LOCAL applies only correctable local workout-set facts as an append-only revision.
        KEEP_SERVER abandons the queued local operation and returns server authority. KEEP_BOTH
        keeps both versions as audit evidence but creates no duplicate set/session and only the
        active server fact contributes to training statistics. An identical decision with the
        original expected conflict version is replayed idempotently.
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody: {$ref: '#/components/requestBodies/SyncConflictResolution'}
      responses:
        '200':
          description: 已裁决且携带客户端收敛所需服务器权威快照
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/SyncConflictResolutionResponse'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/workout-sessions/{id}/summary:
    get:
      tags: [Workouts]
      operationId: getWorkoutSessionSummary
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: 已完成或提前结束训练的汇总事实
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutSessionSummaryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 训练尚未进入终态，错误码为 WORKOUT_NOT_TERMINAL。
          content:
            application/json:
              schema: {$ref: './schemas/workout.yaml#/components/schemas/WorkoutNotTerminalErrorResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/progress/exercises/{exerciseId}:
    get:
      tags: [Progression]
      operationId: getExerciseProgress
      parameters:
        - {$ref: '#/components/parameters/ExerciseIdPath'}
      responses:
        '200':
          description: 有效正式组趋势
          content:
            application/json:
              schema: {$ref: './schemas/progression.yaml#/components/schemas/ExerciseTrendResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/progression-recommendations:
    get:
      tags: [Progression]
      operationId: listProgressionRecommendations
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: './schemas/progression.yaml#/components/schemas/RecommendationStatus'}}
        - {name: cursor, in: query, required: false, description: Base64URL 编码的稳定游标, schema: {type: string, maxLength: 256}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 有界建议列表，按 createdAt、id 倒序
          headers:
            X-Has-More:
              required: true
              schema: {type: boolean}
            X-Next-Cursor:
              required: false
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: './schemas/progression.yaml#/components/schemas/ProgressionRecommendationListResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/progression-recommendations/{id}/apply:
    post:
      tags: [Progression]
      operationId: applyProgressionRecommendation
      description: USER_LOCKED 重量只允许提示；应用前必须显式确认并创建新计划版本。
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - {$ref: './schemas/common.yaml#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/RecommendationApply'}
      responses:
        '200':
          description: 已采纳建议
          content:
            application/json:
              schema: {$ref: './schemas/progression.yaml#/components/schemas/ProgressionRecommendationResponse'}
        '409': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/progression-recommendations/{id}/dismiss:
    post:
      tags: [Progression]
      operationId: dismissProgressionRecommendation
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody: {$ref: '#/components/requestBodies/RecommendationDismiss'}
      responses:
        '200':
          description: 已忽略建议
          content:
            application/json:
              schema: {$ref: './schemas/progression.yaml#/components/schemas/ProgressionRecommendationResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/ai/plan-explanations:
    post:
      tags: [AI]
      operationId: requestPlanExplanation
      description: 仅请求解释，不得改变规则生成的关键数字。
      requestBody: {$ref: '#/components/requestBodies/AiPlanExplanation'}
      responses:
        '200':
          description: 已校验的 AI 解释或模板降级结果
          content:
            application/json:
              schema: {$ref: './schemas/progression.yaml#/components/schemas/AiGeneratedContentResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/ai/workout-summaries:
    post:
      tags: [AI]
      operationId: requestWorkoutSummary
      description: 仅请求解释性总结，规则结论保持权威。
      requestBody: {$ref: '#/components/requestBodies/AiWorkoutSummary'}
      responses:
        '200':
          description: 已校验的训练总结或模板降级结果
          content:
            application/json:
              schema: {$ref: './schemas/progression.yaml#/components/schemas/AiGeneratedContentResponse'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/privacy/export:
    get:
      tags: [Privacy]
      operationId: getOrStartPrivacyExport
      description: 仅导出当前认证用户声明范围内的数据；安全审计和法定保留数据保持分离。
      parameters:
        - name: X-Reauthentication-Proof
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 2048}
      responses:
        '200':
          description: 当前用户的数据导出范围
          content:
            application/json:
              schema: {$ref: './schemas/privacy.yaml#/components/schemas/PrivacyExportResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/privacy/reauthentication-proofs:
    post:
      tags: [Privacy]
      operationId: issueLocalReauthenticationProof
      description: 仅 local/test 隔离环境签发；先用新的微信一次性 code 重新核验当前用户，再签发绑定用户、有效期且只能消费一次的 proof。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schemas/privacy.yaml#/components/schemas/CreateReauthenticationProofRequest'}
      responses:
        '200':
          description: 服务端签发的一次性重新认证证明
          content:
            application/json:
              schema: {$ref: './schemas/privacy.yaml#/components/schemas/ReauthenticationProofResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/privacy/exports/{id}:
    get:
      tags: [Privacy]
      operationId: getPrivacyExport
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: 当前用户自己的、未过期的导出制品
          content:
            application/json:
              schema: {$ref: './schemas/privacy.yaml#/components/schemas/PrivacyExportResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/privacy/deletion-requests:
    post:
      tags: [Privacy]
      operationId: createPrivacyDeletionRequest
      requestBody: {$ref: '#/components/requestBodies/PrivacyDeletion'}
      responses:
        '201':
          description: 删除申请已受理；重复申请返回同一活动申请
          content:
            application/json:
              schema: {$ref: './schemas/privacy.yaml#/components/schemas/DeletionRequestResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/privacy/deletion-requests/{id}:
    get:
      tags: [Privacy]
      operationId: getPrivacyDeletionRequest
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: 当前用户自己的删除申请状态
          content:
            application/json:
              schema: {$ref: './schemas/privacy.yaml#/components/schemas/DeletionRequestResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/DefaultError'}
  /api/v1/privacy/deletion-requests/{id}/process:
    post:
      tags: [Privacy]
      operationId: processLocalPrivacyDeletionRequest
      description: 仅 local/test 隔离 fixture 使用；生产环境不注册此入口。
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
        - name: X-Reauthentication-Proof
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 2048}
        - name: X-Local-Deletion-Approval
          in: header
          required: true
          schema: {type: string, enum: [LOCAL_TEST_APPROVED]}
      responses:
        '200':
          description: 隔离 fixture 删除流程执行结果
          content:
            application/json:
              schema: {$ref: './schemas/privacy.yaml#/components/schemas/DeletionRequestResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/DefaultError'}
components:
  schemas:
    ApiResponse: {$ref: './schemas/common.yaml#/components/schemas/ApiResponse'}
    ApiError: {$ref: './schemas/common.yaml#/components/schemas/ApiError'}
    ApiErrorResponse: {$ref: './schemas/common.yaml#/components/schemas/ApiErrorResponse'}
    FieldError: {$ref: './schemas/common.yaml#/components/schemas/FieldError'}
    ResponseMeta: {$ref: './schemas/common.yaml#/components/schemas/ResponseMeta'}
    ErrorMeta: {$ref: './schemas/common.yaml#/components/schemas/ErrorMeta'}
    RequestId: {$ref: './schemas/common.yaml#/components/schemas/RequestId'}
    UtcDateTime: {$ref: './schemas/common.yaml#/components/schemas/UtcDateTime'}
    ExpectedVersion: {$ref: './schemas/common.yaml#/components/schemas/ExpectedVersion'}
    ErrorCode: {$ref: './schemas/common.yaml#/components/schemas/ErrorCode'}
    Weight: {$ref: './schemas/common.yaml#/components/schemas/Weight'}
    WeightUnit: {$ref: './schemas/common.yaml#/components/schemas/WeightUnit'}
    RuleReference: {$ref: './schemas/common.yaml#/components/schemas/RuleReference'}
    ValidationSeverity: {$ref: './schemas/plan.yaml#/components/schemas/ValidationSeverity'}
    AiExplanationStatus: {$ref: './schemas/plan.yaml#/components/schemas/AiExplanationStatus'}
    WeightStatus: {$ref: './schemas/plan.yaml#/components/schemas/WeightStatus'}
    LockStatus: {$ref: './schemas/plan.yaml#/components/schemas/LockStatus'}
    SessionStatus: {$ref: './schemas/workout.yaml#/components/schemas/SessionStatus'}
    SyncOperationStatus: {$ref: './schemas/workout.yaml#/components/schemas/SyncOperationStatus'}
    ProgressionDecision: {$ref: './schemas/progression.yaml#/components/schemas/ProgressionDecision'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdPath: {name: id, in: path, required: true, schema: {type: string}}
    PlanIdPath: {name: planId, in: path, required: true, schema: {type: string}}
    VersionNoPath: {name: versionNo, in: path, required: true, schema: {type: integer, minimum: 1}}
    ExerciseIdPath: {name: exerciseId, in: path, required: true, schema: {type: string}}
    ClientSetKeyPath: {name: clientSetKey, in: path, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
    SessionIdPath: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    ClientSetKeyAsSetIdPath:
      name: setId
      in: path
      required: true
      description: PUT 兼容路径参数，值为客户端生成的 clientSetKey。
      schema: {type: string, minLength: 8, maxLength: 128}
    SetIdPath: {name: setId, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    WechatLogin: {required: true, content: {application/json: {schema: {$ref: './schemas/profile.yaml#/components/schemas/WechatLoginRequest'}}}}
    RefreshSession: {required: true, content: {application/json: {schema: {$ref: './schemas/profile.yaml#/components/schemas/RefreshSessionRequest'}}}}
    ProfileUpdate: {required: true, content: {application/json: {schema: {$ref: './schemas/profile.yaml#/components/schemas/UpdateProfileRequest'}}}}
    EquipmentUpdate: {required: true, content: {application/json: {schema: {$ref: './schemas/profile.yaml#/components/schemas/UpdateEquipmentRequest'}}}}
    PreferencesUpdate: {required: true, content: {application/json: {schema: {$ref: './schemas/profile.yaml#/components/schemas/UpdatePreferencesRequest'}}}}
    PlanCandidates: {required: true, content: {application/json: {schema: {$ref: './schemas/plan.yaml#/components/schemas/PlanCandidateRequest'}}}}
    PlanValidation: {required: true, content: {application/json: {schema: {$ref: './schemas/plan.yaml#/components/schemas/ValidatePlanRequest'}}}}
    PlanCreation: {required: true, content: {application/json: {schema: {$ref: './schemas/plan.yaml#/components/schemas/CreatePlanRequest'}}}}
    PlanVersionCreation: {required: true, content: {application/json: {schema: {$ref: './schemas/plan.yaml#/components/schemas/CreatePlanVersionRequest'}}}}
    PlanRebalance: {required: true, content: {application/json: {schema: {$ref: './schemas/plan.yaml#/components/schemas/RebalancePlanRequest'}}}}
    WorkoutSessionStart: {required: true, content: {application/json: {schema: {$ref: './schemas/workout.yaml#/components/schemas/StartWorkoutSessionRequest'}}}}
    WorkoutStatusUpdate: {required: true, content: {application/json: {schema: {$ref: './schemas/workout.yaml#/components/schemas/UpdateSessionStatusRequest'}}}}
    WorkoutExerciseUpdate: {required: true, content: {application/json: {schema: {$ref: './schemas/workout.yaml#/components/schemas/UpdateSessionExerciseRequest'}}}}
    SetUpsert: {required: true, content: {application/json: {schema: {$ref: './schemas/workout.yaml#/components/schemas/UpsertSetRequest'}}}}
    SetDeletion: {required: true, content: {application/json: {schema: {$ref: './schemas/workout.yaml#/components/schemas/DeleteSetRequest'}}}}
    WorkoutCompletion: {required: true, content: {application/json: {schema: {$ref: './schemas/workout.yaml#/components/schemas/CompleteSessionRequest'}}}}
    WorkoutOperationSync: {required: true, content: {application/json: {schema: {$ref: './schemas/workout.yaml#/components/schemas/SyncWorkoutOperationsRequest'}}}}
    SyncConflictResolution: {required: true, content: {application/json: {schema: {$ref: './schemas/workout.yaml#/components/schemas/ResolveSyncConflictRequest'}}}}
    RecommendationApply: {required: true, content: {application/json: {schema: {$ref: './schemas/progression.yaml#/components/schemas/ApplyRecommendationRequest'}}}}
    RecommendationDismiss: {required: true, content: {application/json: {schema: {$ref: './schemas/progression.yaml#/components/schemas/DismissRecommendationRequest'}}}}
    AiPlanExplanation: {required: true, content: {application/json: {schema: {$ref: './schemas/progression.yaml#/components/schemas/AiPlanExplanationRequest'}}}}
    AiWorkoutSummary: {required: true, content: {application/json: {schema: {$ref: './schemas/progression.yaml#/components/schemas/AiWorkoutSummaryRequest'}}}}
    PrivacyDeletion: {required: true, content: {application/json: {schema: {$ref: './schemas/privacy.yaml#/components/schemas/CreateDeletionRequest'}}}}
  responses:
    Success: {$ref: './schemas/common.yaml#/components/responses/Success'}
    BadRequest: {$ref: './schemas/common.yaml#/components/responses/BadRequest'}
    Unauthorized: {$ref: './schemas/common.yaml#/components/responses/Unauthorized'}
    NotFound: {$ref: './schemas/common.yaml#/components/responses/NotFound'}
    VersionConflict: {$ref: './schemas/common.yaml#/components/responses/VersionConflict'}
    TooManyRequests: {$ref: './schemas/common.yaml#/components/responses/TooManyRequests'}
    DefaultError: {$ref: './schemas/common.yaml#/components/responses/DefaultError'}
