components:
  schemas:
    ValidationSeverity:
      type: string
      enum: [INFO, WARNING, ERROR]
    AiExplanationStatus:
      type: string
      enum: [READY, PENDING, DEGRADED]
    PlanGenerationStatus:
      type: string
      enum: [CANDIDATE_READY, NO_CANDIDATE]
    WeightStatus:
      type: string
      enum: [KNOWN, NEEDS_CALIBRATION, BODYWEIGHT]
    LockStatus:
      type: string
      enum: [USER_LOCKED, RULE_LOCKED, UNLOCKED]
    LockCommandStatus:
      type: string
      enum: [USER_LOCKED, UNLOCKED]
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [severity, reasonCode, fieldPath]
      properties:
        severity:
          $ref: '#/components/schemas/ValidationSeverity'
        reasonCode:
          type: string
        fieldPath:
          type: string
        parameters:
          type: object
          additionalProperties: true
    ExerciseCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name, contentVersion]
      properties:
        id: {type: string}
        name: {type: string}
        contentVersion: {type: string}
    PlanTemplateSummary:
      type: object
      additionalProperties: false
      required: [id, templateVersion, weeklyFrequency]
      properties:
        id: {type: string}
        templateVersion: {type: string}
        weeklyFrequency: {type: integer, minimum: 2, maximum: 6}
    PlanDraft:
      type: object
      additionalProperties: false
      required: [templateCode, name, days, locks]
      properties:
        templateCode: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        days:
          type: array
          minItems: 1
          maxItems: 6
          items: {$ref: '#/components/schemas/PlanDay'}
        locks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LockStatus'
    PlanDay:
      type: object
      additionalProperties: false
      required: [code, name, exercises]
      properties:
        code: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        exercises:
          type: array
          minItems: 1
          maxItems: 8
          items: {$ref: '#/components/schemas/PlanExercise'}
    PlanExercise:
      type: object
      additionalProperties: false
      required: [exerciseCode, workSets, repMin, repMax, restSeconds, weightStatus]
      properties:
        exerciseCode: {type: string, minLength: 1}
        workSets: {type: integer, minimum: 0}
        repMin: {type: integer, minimum: 0}
        repMax: {type: integer, minimum: 0}
        restSeconds: {type: integer, minimum: 0}
        weightStatus: {$ref: '#/components/schemas/WeightStatus'}
        targetWeightKg: {type: number, minimum: 0, multipleOf: 0.01}
    PlanCandidateRequest:
      type: object
      additionalProperties: false
      required: [profileVersion]
      properties:
        profileVersion:
          $ref: './common.yaml#/components/schemas/ExpectedVersion'
        lockedFields:
          type: object
          maxProperties: 100
          propertyNames:
            type: string
            minLength: 1
            maxLength: 256
            pattern: '^/days/'
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 3600
    PlanCandidate:
      type: object
      additionalProperties: false
      required: [candidateId, plan, validationIssues, ruleReference, lockedFieldOutcomes, explanationStatus, explanation, expiresAt]
      properties:
        candidateId: {type: string}
        plan: {$ref: '#/components/schemas/PlanDraft'}
        validationIssues:
          type: array
          items: {$ref: '#/components/schemas/ValidationIssue'}
        ruleReference: {$ref: './common.yaml#/components/schemas/RuleReference'}
        lockedFieldOutcomes:
          type: object
          additionalProperties: {$ref: '#/components/schemas/LockStatus'}
        explanationStatus: {$ref: '#/components/schemas/AiExplanationStatus'}
        explanation: {type: string, minLength: 1}
        expiresAt: {$ref: './common.yaml#/components/schemas/UtcDateTime'}
    ValidatePlanRequest:
      type: object
      additionalProperties: false
      required: [plan, ruleReference]
      properties:
        plan: {$ref: '#/components/schemas/PlanValidationDraft'}
        ruleReference: {$ref: './common.yaml#/components/schemas/RuleReference'}
    PlanValidationDraft:
      type: object
      additionalProperties: false
      required: [templateCode, name, days]
      properties:
        templateCode: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        days:
          type: array
          minItems: 1
          maxItems: 6
          items: {$ref: '#/components/schemas/PlanDay'}
    PlanCandidateGenerationData:
      type: object
      additionalProperties: false
      required: [status, validationIssues, lockedFieldOutcomes]
      properties:
        status: {$ref: '#/components/schemas/PlanGenerationStatus'}
        candidate: {$ref: '#/components/schemas/PlanCandidate'}
        validationIssues:
          type: array
          items: {$ref: '#/components/schemas/ValidationIssue'}
        lockedFieldOutcomes:
          type: object
          additionalProperties: {$ref: '#/components/schemas/LockStatus'}
    PlanCandidateGenerationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PlanCandidateGenerationData'}
        meta: {$ref: './common.yaml#/components/schemas/ResponseMeta'}
    PlanValidationData:
      type: object
      additionalProperties: false
      required: [valid, validationIssues]
      properties:
        valid: {type: boolean}
        validationIssues:
          type: array
          items: {$ref: '#/components/schemas/ValidationIssue'}
    PlanValidationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PlanValidationData'}
        meta: {$ref: './common.yaml#/components/schemas/ResponseMeta'}
    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId: {type: string}
    CreatePlanVersionRequest:
      type: object
      additionalProperties: false
      required: [plan, baseVersionNumber, locks]
      properties:
        plan: {$ref: '#/components/schemas/PlanValidationDraft'}
        baseVersionNumber: {type: integer, minimum: 1}
        locks:
          type: object
          maxProperties: 100
          propertyNames:
            type: string
            pattern: '^/days/[^/]+/exercises/[^/]+/(workSets|repMin|repMax|restSeconds)$'
          additionalProperties: {$ref: '#/components/schemas/LockCommandStatus'}
        warningConfirmationToken: {type: string, minLength: 1, maxLength: 128}
    RebalancePlanRequest:
      type: object
      additionalProperties: false
      required: [plan, baseVersionNumber, locks]
      properties:
        plan: {$ref: '#/components/schemas/PlanValidationDraft'}
        baseVersionNumber: {type: integer, minimum: 1}
        locks:
          type: object
          maxProperties: 100
          propertyNames:
            type: string
            pattern: '^/days/[^/]+/exercises/[^/]+/(workSets|repMin|repMax|restSeconds)$'
          additionalProperties: {$ref: '#/components/schemas/LockCommandStatus'}
    PlanVersionStatus:
      type: string
      enum: [PREVIEW, WARNING_CONFIRMATION_REQUIRED, VALIDATION_ERROR, CREATED]
    PlanVersionData:
      type: object
      additionalProperties: false
      required: [id, planId, versionNumber, sourceType, plan, ruleReference, confirmedWarningCodes, createdAt]
      properties:
        id: {type: string, format: uuid}
        planId: {type: string, format: uuid}
        versionNumber: {type: integer, minimum: 1}
        sourceType:
          type: string
          enum: [INITIAL, USER_EDIT, REBALANCE, PROGRESSION]
        plan: {$ref: '#/components/schemas/PlanDraft'}
        ruleReference: {$ref: './common.yaml#/components/schemas/RuleReference'}
        confirmedWarningCodes:
          type: array
          uniqueItems: true
          items: {type: string}
        createdAt: {$ref: './common.yaml#/components/schemas/UtcDateTime'}
    ActivePlanData:
      type: object
      additionalProperties: false
      required: [planId, activeVersion]
      properties:
        planId: {type: string, format: uuid}
        activeVersion: {$ref: '#/components/schemas/PlanVersionData'}
    PlanVersionResultData:
      type: object
      additionalProperties: false
      required: [status, plan, validationIssues]
      properties:
        status: {$ref: '#/components/schemas/PlanVersionStatus'}
        plan: {$ref: '#/components/schemas/PlanDraft'}
        validationIssues:
          type: array
          items: {$ref: '#/components/schemas/ValidationIssue'}
        warningConfirmationToken: {type: string}
        version: {$ref: '#/components/schemas/PlanVersionData'}
    ActivePlanResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/ActivePlanData'}
        meta: {$ref: './common.yaml#/components/schemas/ResponseMeta'}
    PlanVersionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PlanVersionData'}
        meta: {$ref: './common.yaml#/components/schemas/ResponseMeta'}
    PlanVersionResultResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PlanVersionResultData'}
        meta: {$ref: './common.yaml#/components/schemas/ResponseMeta'}
