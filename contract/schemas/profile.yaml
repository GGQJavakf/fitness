components:
  schemas:
    WechatLoginRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 2048
          description: 微信临时登录码，不得写入日志或持久化。
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 4096
    SessionData:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt, refreshToken]
      properties:
        accessToken:
          type: string
        expiresAt:
          $ref: './common.yaml#/components/schemas/UtcDateTime'
        refreshToken:
          type: string
    ExperienceLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    FitnessGoal:
      type: string
      enum: [STRENGTH, HYPERTROPHY, GENERAL_FITNESS]
    TrainingLocation:
      type: string
      enum: [HOME, GYM, OTHER]
    UserProfile:
      type: object
      additionalProperties: false
      required: [experience, goal, weeklyFrequency, sessionMinutes, location, version]
      properties:
        experience:
          $ref: '#/components/schemas/ExperienceLevel'
        goal:
          $ref: '#/components/schemas/FitnessGoal'
        weeklyFrequency:
          type: integer
          minimum: 2
          maximum: 6
        sessionMinutes:
          type: integer
          enum: [30, 45, 60, 75, 90]
        location:
          $ref: '#/components/schemas/TrainingLocation'
        version:
          $ref: './common.yaml#/components/schemas/ExpectedVersion'
    UserProfileResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/UserProfile'
        meta:
          $ref: './common.yaml#/components/schemas/ResponseMeta'
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [experience, goal, weeklyFrequency, sessionMinutes, location, expectedVersion]
      properties:
        experience:
          $ref: '#/components/schemas/ExperienceLevel'
        goal:
          $ref: '#/components/schemas/FitnessGoal'
        weeklyFrequency:
          type: integer
          minimum: 2
          maximum: 6
        sessionMinutes:
          type: integer
          enum: [30, 45, 60, 75, 90]
        location:
          $ref: '#/components/schemas/TrainingLocation'
        expectedVersion:
          $ref: './common.yaml#/components/schemas/ExpectedVersion'
    EquipmentItem:
      type: object
      additionalProperties: false
      required: [clientEquipmentKey, equipmentType, minIncrement, availableLevels]
      properties:
        clientEquipmentKey:
          type: string
          format: uuid
          description: 客户端离线稳定键；服务端内部 user_equipment.id 不对外开放。
        equipmentType:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]*$'
        minIncrement:
          $ref: './common.yaml#/components/schemas/Weight'
        availableLevels:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: './common.yaml#/components/schemas/Weight'
    EquipmentWeightInput:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
        unit:
          $ref: './common.yaml#/components/schemas/WeightUnit'
    EquipmentItemRequest:
      type: object
      additionalProperties: false
      required: [clientEquipmentKey, equipmentType, minIncrement, availableLevels]
      properties:
        clientEquipmentKey:
          type: string
          format: uuid
          description: 客户端离线稳定键；服务端内部 user_equipment.id 不对外开放。
        equipmentType:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]*$'
        minIncrement:
          $ref: '#/components/schemas/EquipmentWeightInput'
        availableLevels:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/EquipmentWeightInput'
    EquipmentProfile:
      type: object
      additionalProperties: false
      required: [items, version]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EquipmentItem'
        version:
          $ref: './common.yaml#/components/schemas/ExpectedVersion'
    EquipmentProfileResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/EquipmentProfile'
        meta:
          $ref: './common.yaml#/components/schemas/ResponseMeta'
    UpdateEquipmentRequest:
      type: object
      additionalProperties: false
      required: [items, expectedVersion]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EquipmentItemRequest'
        expectedVersion:
          $ref: './common.yaml#/components/schemas/ExpectedVersion'
    ExercisePreference:
      type: object
      additionalProperties: false
      required: [exerciseId, preferenceType]
      properties:
        exerciseId:
          type: string
          format: uuid
        preferenceType:
          type: string
          enum: [PREFERRED, EXCLUDED]
    PreferenceProfile:
      type: object
      additionalProperties: false
      required: [items, version]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ExercisePreference'
        version:
          $ref: './common.yaml#/components/schemas/ExpectedVersion'
    PreferenceProfileResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/PreferenceProfile'
        meta:
          $ref: './common.yaml#/components/schemas/ResponseMeta'
    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      required: [items, expectedVersion]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ExercisePreference'
        expectedVersion:
          $ref: './common.yaml#/components/schemas/ExpectedVersion'
