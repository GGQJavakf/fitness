components:
  schemas:
    PrivacyDataCategory:
      type: string
      enum: [PROFILE, EQUIPMENT, PREFERENCES, PLANS, WORKOUTS]
    RetentionCategory:
      type: string
      enum: [SECURITY_AUDIT, LEGAL_HOLD]
    PrivacyExportStatus:
      type: string
      enum: [READY]
    PrivacyExportResource:
      type: object
      additionalProperties: false
      required: [category, recordCount, records]
      properties:
        category: {$ref: '#/components/schemas/PrivacyDataCategory'}
        recordCount: {type: integer, minimum: 0}
        records:
          type: array
          items: {$ref: '#/components/schemas/PrivacyExportRecord'}
    PrivacyExportRecord:
      type: object
      additionalProperties: false
      required: [id, summary]
      properties:
        id: {type: string, minLength: 1}
        summary: {type: string, minLength: 1, maxLength: 256}
    ReauthenticationProofData:
      type: object
      additionalProperties: false
      required: [proof, issuedAt, expiresAt]
      properties:
        proof: {type: string, minLength: 32, maxLength: 256}
        issuedAt: {$ref: './common.yaml#/components/schemas/UtcDateTime'}
        expiresAt: {$ref: './common.yaml#/components/schemas/UtcDateTime'}
    CreateReauthenticationProofRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
    DeletionStatus:
      type: string
      enum:
        - REQUESTED
        - ACCESS_REVOKED
        - BUSINESS_DATA_ANONYMIZED
        - RETENTION_SEPARATED
        - COMPLETED
        - REJECTED
    CreateDeletionRequest:
      type: object
      additionalProperties: false
      required: [reauthenticationProof, confirmationText]
      properties:
        reauthenticationProof:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
        confirmationText:
          type: string
          enum: [DELETE]
    PrivacyExportData:
      type: object
      additionalProperties: false
      required: [id, status, generatedAt, expiresAt, resources, scope, excludedRetentionCategories]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/PrivacyExportStatus'}
        generatedAt: {$ref: './common.yaml#/components/schemas/UtcDateTime'}
        expiresAt: {$ref: './common.yaml#/components/schemas/UtcDateTime'}
        resources:
          type: array
          items:
            $ref: '#/components/schemas/PrivacyExportResource'
        scope:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PrivacyDataCategory'
        excludedRetentionCategories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RetentionCategory'
    DeletionRequestData:
      type: object
      additionalProperties: false
      required: [id, status, requestedAt, updatedAt, deletionScope, retainedCategories]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/DeletionStatus'}
        requestedAt: {$ref: './common.yaml#/components/schemas/UtcDateTime'}
        updatedAt: {$ref: './common.yaml#/components/schemas/UtcDateTime'}
        deletionScope:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PrivacyDataCategory'
        retainedCategories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RetentionCategory'
    PrivacyExportResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PrivacyExportData'}
        meta: {$ref: './common.yaml#/components/schemas/ResponseMeta'}
    ReauthenticationProofResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/ReauthenticationProofData'}
        meta: {$ref: './common.yaml#/components/schemas/ResponseMeta'}
    DeletionRequestResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/DeletionRequestData'}
        meta: {$ref: './common.yaml#/components/schemas/ResponseMeta'}
