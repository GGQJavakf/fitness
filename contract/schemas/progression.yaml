components:
  schemas:
    ProgressionDecision:
      type: string
      enum: [INCREASE, KEEP, REDUCE, REVIEW]
    RecommendationStatus:
      type: string
      enum: [PENDING, APPLIED, MODIFIED, DISMISSED]
    ApplyRecommendationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {$ref: './common.yaml#/components/schemas/ExpectedVersion'}
        acceptedWeight: {$ref: './common.yaml#/components/schemas/Weight'}
    DismissRecommendationRequest:
      type: object
      additionalProperties: false
      properties:
        reasonCode: {type: string}
    AiPlanExplanationRequest:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId: {type: string}
    AiWorkoutSummaryRequest:
      type: object
      additionalProperties: false
      required: [workoutSessionId]
      properties:
        workoutSessionId: {type: string}
